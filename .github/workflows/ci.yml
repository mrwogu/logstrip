name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:00 UTC: re-validate main against the live registry even when
    # nobody commits. Scheduled workflows only run on the default branch.
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: Test with 100% coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: npm run smoke:cli

      - name: Plugin hook smoke test
        run: npm run smoke:hooks

      - name: Compress CI logs with LogStrip
        if: ${{ matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest' }}
        id: logstrip
        # Intentionally the floating major tag of this repo's own action: the
        # step dogfoods the latest published v1, so it is not pinned to a SHA.
        uses: mrwogu/logstrip@v1
        with:
          log-path: tests/fixtures/ci-platforms.log
          aggressiveness: auto

      - name: Security audit
        run: npm audit

      - name: Setup Python for docs
        if: ${{ matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        if: ${{ matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest' }}
        run: pip install -r requirements-docs.txt

      - name: Build docs
        if: ${{ matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest' }}
        run: npm run docs:build

      - name: Upload coverage to Codecov
        if: ${{ matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Upload coverage artifact
        if: ${{ matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

      - name: Upload action artifact
        if: ${{ matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logstrip-action
          path: |
            action.yml
            package.json
            package-lock.json
            dist/action
            dist/cli
            dist/core
          retention-days: 7

  action-smoke-test:
    name: Action Artifact Smoke Test
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download action artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: logstrip-action
          path: action-package

      - name: Smoke test parser artifact
        run: node scripts/ci-action-artifact-smoke.js action-package

      - name: Smoke test bundled GitHub Action
        uses: ./action-package
        with:
          log-path: raw.log

      - name: Verify action output
        run: node scripts/ci-assert-smoke-output.js raw.logstrip.log
