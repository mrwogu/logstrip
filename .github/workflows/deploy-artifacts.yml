name: Deploy Artifacts

on:
  push:
    # Release tags only; the floating vN tag that release-please.yml moves
    # must not get a release of its own.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
          registry-url: https://registry.npmjs.org

      # Lifecycle scripts of dependencies stay off; the build needs none.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate
        run: |
          npm run typecheck
          npm run test:coverage
          npm run build
          npm audit

      - name: Package artifacts
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p artifacts
          npm pack --pack-destination artifacts
          tar -czf "artifacts/logstrip-action-v${VERSION}.tar.gz" \
            action.yml package.json package-lock.json dist/action dist/cli dist/core

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logstrip-v${{ steps.package.outputs.version }}
          path: artifacts/*
          retention-days: 30

      # A tag pushed again (a rebuild, a rerun) keeps the assets its release
      # already has; only a release without assets gets them.
      - name: Check the release for assets
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          echo "assets=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release artifacts
        if: startsWith(github.ref, 'refs/tags/v') && steps.release.outputs.assets == '0'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
