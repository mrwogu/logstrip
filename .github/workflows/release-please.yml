name: Release Please

# Two paths. A push to main (or a manual run with no tag) lets release-please
# open or merge the release PR and create the vX.Y.Z tag; with RELEASE_PAT
# that tag push starts this workflow again. A vX.Y.Z tag push, or a manual run
# naming an existing tag, checks that dist/ on the tag (committed in the
# release PR by release-dist.yml) matches a fresh build, publishes to npm and
# moves the major tag. The main push never publishes by itself, so a release
# is published exactly once.
on:
  push:
    branches: [main]
    # Release tags only; the floating vN tag the workflow moves must not start
    # another run.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish again (for example v2.0.0). Leave empty for the normal run.'
        required: false
        default: ''

permissions:
  contents: read

# A release run must never be cancelled half way through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
    permissions:
      contents: write
      pull-requests: write
      # npm provenance for `npm publish`
      id-token: write

    steps:
      - name: Create or update release PR
        if: ${{ github.ref_type == 'branch' && github.event.inputs.tag == '' }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT lets CI run on the release PR (events created with the default
          # token start no workflows). Falls back to the default token.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # One tag to publish: the pushed tag, or the one passed by hand. A main
      # push only creates the release; its tag push comes back as its own run.
      - name: Pick the tag to publish
        id: plan
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$PUSHED_TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.plan.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # A hand-picked tag must be a real release of this repository: a strict
      # vX.Y.Z name, a commit on main and the version package.json carries.
      - name: Validate the tag
        if: ${{ steps.plan.outputs.publish == 'true' }}
        id: validate
        env:
          TAG_NAME: ${{ steps.plan.outputs.tag }}
        run: |
          case "$TAG_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a release tag: $TAG_NAME"; exit 1 ;;
          esac
          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a release tag: $TAG_NAME"; exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TAG_NAME" origin/main; then
            echo "::error::$TAG_NAME is not on main"; exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG_NAME" ]; then
            echo "::error::package.json is $VERSION but the tag is $TAG_NAME"; exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for npm
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Lifecycle scripts of dependencies stay off; the build needs none
      # (esbuild ships its binary as an optional dependency).
      - name: Install dependencies
        if: ${{ steps.plan.outputs.publish == 'true' }}
        run: npm ci --ignore-scripts

      # dist/ is removed before the build so a file on the tag that the build
      # does not produce shows up as deleted in the check below.
      - name: Verify release build
        if: ${{ steps.plan.outputs.publish == 'true' }}
        run: |
          npm run typecheck
          npm run test:coverage
          rm -rf dist
          npm run build
          npm audit

      # dist/ on the tag was committed in the release PR by release-dist.yml.
      # The build above overwrote it; any difference means the tag does not
      # carry the build of its own source, so nothing is published.
      - name: Check dist/ on the tag against the build
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          TAG_NAME: ${{ steps.plan.outputs.tag }}
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            git status --short -- dist/
            echo "::error::dist/ on ${TAG_NAME} does not match a fresh build"; exit 1
          fi
          echo "dist/ on ${TAG_NAME} matches the build"

      # npm refuses to publish a version twice, so a run that publishes an
      # existing tag again (to move the major tag, for example) skips it.
      - name: Publish to npm
        if: ${{ steps.plan.outputs.publish == 'true' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "logstrip@${VERSION}" version >/dev/null 2>&1; then
            echo "logstrip@${VERSION} is already on the registry, publish skipped"
          else
            npm publish
          fi

  # The floating vN tag follows the newest vN.x.y release only, so a
  # re-publish of an older patch never rolls action users back. The ref is
  # moved through the API with RELEASE_PAT (workflow scope): the default token
  # may not move a tag when the workflow files differ between its old and new
  # target (or main, for a new tag), and the floating tag spans releases that
  # change workflows. The PAT lives in this job only, which checks out nothing
  # and installs nothing, so code from the build job never sees it.
  major-tag:
    needs: release-please
    if: ${{ needs.release-please.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Update major action tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag }}
          SHA: ${{ needs.release-please.outputs.sha }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a release tag: $TAG_NAME"; exit 1
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::no commit to tag"; exit 1
          fi
          MAJOR_TAG="${TAG_NAME%%.*}"
          NEWEST=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${MAJOR_TAG}." --jq '.[].ref' | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$NEWEST" != "$TAG_NAME" ]; then
            echo "$MAJOR_TAG stays on $NEWEST, $TAG_NAME is older"
            exit 0
          fi
          if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${MAJOR_TAG}" 2>/dev/null; then
            gh api --silent -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}" -f sha="$SHA" -F force=true
          else
            gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${MAJOR_TAG}" -f sha="$SHA"
          fi
          echo "$MAJOR_TAG -> $SHA"
