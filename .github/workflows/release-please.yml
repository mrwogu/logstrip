name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A release run must never be cancelled half way through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # npm provenance for `npm publish`
      id-token: write

    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT lets CI run on the release PR (events created with the default
          # token start no workflows). Falls back to the default token.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release tag
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Credentials stay: a later step pushes dist/ and the release tags.
          persist-credentials: true

      - name: Setup Node.js for npm
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Verify release build
        if: ${{ steps.release.outputs.release_created }}
        run: |
          npm run typecheck
          npm run test:coverage
          npm run build
          npm audit

      - name: Commit dist/ into main and release tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild dist/ for ${TAG_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git tag -f "${TAG_NAME}" HEAD
          git push origin "refs/tags/${TAG_NAME}" --force

      - name: Update major action tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          MAJOR_TAG=$(node -e "const tag = process.env.TAG_NAME; const match = /^v(\\d+)\\./.exec(tag); if (!match) process.exit(1); console.log('v' + match[1]);")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR_TAG" HEAD
          git push origin "refs/tags/$MAJOR_TAG" --force

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish

